name: Market Wire Reliability Tests
on:
  pull_request:
  push:
    branches:
      - 'fix/market-wire-reliability-*'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pyyaml
      - run: python -m compileall -q src sources telegram_dispatcher.py config.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
