name: Market wire (posting shifts)

# Posting runs only on GitHub Actions. Cron at 07:00, 13:00 and 19:00 IST plus a
# 15-minute watchdog start the first chunk; each chunk runs up to 50 minutes, saves
# state, and chains the next until 23:30 IST. BSE every 10 s, NSE every 15 s. State
# is restored from and saved to the Actions cache so nothing is reposted across runs.
on:
  schedule:
    - cron: '30 1 * * *'    # 07:00 IST
    - cron: '30 7 * * *'    # 13:00 IST
    - cron: '30 13 * * *'   # 19:00 IST
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Cap this shift in minutes (0 = until the next slot)'
        default: '10'
      dry_run:
        description: 'Dry run (no Telegram posts)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: market-wire          # one shift at a time; the next waits for state to be saved
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      POLL_INTERVAL: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore wire state
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            state
          key: wire-state-${{ github.run_id }}
          restore-keys: wire-state-
      - name: Run shift
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--max-minutes ${{ inputs.max_minutes }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          fi
          python scripts/actions_shift.py $ARGS
      - name: Save wire state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            state
          key: wire-state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wire-state-${{ github.run_id }}
          path: |
            data
            state
          retention-days: 7
      - name: Chain next chunk
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          CHAIN_REF: ${{ github.ref_name }}
        run: python scripts/chain_shift.py
