name: Tests and source checks

# Posting runs in market-wire.yml (chained Actions shifts). This workflow
# only runs tests and read-only source probes.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 1-17 * * 1-5'   # hourly 06:47–22:47 IST on weekdays: never posts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe every source (read-only; no Telegram secrets are exposed to this job)
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python scripts/probe_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-probe-${{ github.run_id }}
          path: source-probe.json
          retention-days: 7
