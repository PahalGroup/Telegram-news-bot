name: Indian Market Wire Cron Job

on:
  schedule:
    # Hourly recovery trigger. Scheduled Actions can be delayed.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: market-wire-production
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_reliability.py' -v
      - name: Run production shift
        id: daemon
        timeout-minutes: 58
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.daemon --duration 3240
      - name: Persist deduplication state
        id: persist
        if: always() && steps.daemon.outcome != 'skipped'
        run: |
          set -euo pipefail
          test -f state/daemon_state.json
          python -m json.tool state/daemon_state.json > /dev/null
          git config user.name "MarketWire-Bot[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add state/daemon_state.json data/market_wire.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist market wire state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve recovery snapshot
        if: failure() && steps.daemon.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: market-wire-state-${{ github.run_id }}
          path: |
            state/daemon_state.json
            data/market_wire.db
          retention-days: 7
      - name: Start next shift after state is saved
        if: success() && steps.daemon.outcome == 'success' && steps.persist.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run corn.yml --ref main
