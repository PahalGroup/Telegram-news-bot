name: Market wire watchdog

# GitHub cron is often late or skipped. Every 15 minutes, start a live
# posting chunk if we are inside 07:00–23:30 IST and none is running.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ensure-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a live shift is running
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || github.token }}
          CHAIN_REF: main
        run: python scripts/ensure_shift.py
